name: Deploy Football AI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify static application
        shell: bash
        run: |
          if [ -d tests ]; then
            node --test tests
          else
            echo "tests/ directory is not present; skipping optional checks."
          fi
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
